<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dff3d6" />
    <title>小蛙回家路 · 萌系试玩版</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="game-shell" aria-label="小蛙回家路萌系试玩版">
        <canvas id="game" width="750" height="1334" aria-label="游戏画面"></canvas>

        <header class="hud" aria-live="polite">
          <div class="chapter">
            <span class="eyebrow">第一章 · 荷花池</span>
            <strong id="stageText">回家的第 1 步</strong>
          </div>
          <div class="firefly-pill" aria-label="萤火虫数量">
            <span class="firefly-icon">✦</span>
            <strong id="fireflyText">0</strong>
          </div>
        </header>

        <div class="progress-track" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div id="hint" class="hint">
          <span class="finger">☝</span>
          <div><strong>按住屏幕蓄力</strong><small>松开就会跳出去</small></div>
        </div>

        <div id="powerWrap" class="power-wrap" aria-hidden="true">
          <span>轻轻</span>
          <div class="power-track"><div id="powerFill" class="power-fill"></div></div>
          <span>远远</span>
        </div>

        <div id="toast" class="toast" aria-live="polite"></div>

        <div id="startOverlay" class="overlay visible">
          <div class="story-card">
            <div class="mini-scene" aria-hidden="true">
              <span class="reed reed-a"></span>
              <span class="reed reed-b"></span>
              <span class="mini-lily"></span>
              <span class="mini-frog">
                <i class="mini-eye mini-eye-a"></i>
                <i class="mini-eye mini-eye-b"></i>
                <i class="mini-cheek mini-cheek-a"></i>
                <i class="mini-cheek mini-cheek-b"></i>
                <i class="mini-mouth"></i>
                <i class="mini-foot mini-foot-a"></i>
                <i class="mini-foot mini-foot-b"></i>
                <i class="mini-foot mini-foot-c"></i>
                <i class="mini-foot mini-foot-d"></i>
              </span>
            </div>
            <span class="story-kicker">一个手指就能玩</span>
            <h1>小蛙回家路</h1>
            <p>池塘那头传来了妈妈的声音。<br />踩着荷叶，一步一步跳回家吧。</p>
            <button id="startButton" class="primary-button" type="button">开始回家</button>
            <small>操作：按住蓄力，松开跳跃</small>
          </div>
        </div>

        <div id="failOverlay" class="overlay">
          <div class="result-card fail-card">
            <span class="result-emoji">💦</span>
            <h2>哎呀，掉进水里了</h2>
            <p>蜻蜓可以把小蛙送回上一片荷叶。</p>
            <button id="reviveButton" class="primary-button ad-button" type="button">
              <span>▶</span> 蜻蜓救援
            </button>
            <button id="restartButton" class="text-button" type="button">从第一片荷叶重来</button>
            <small>“蜻蜓救援”用于模拟激励广告复活</small>
          </div>
        </div>

        <div id="winOverlay" class="overlay">
          <div class="result-card win-card">
            <span class="result-emoji">🌙</span>
            <span class="story-kicker">第一章完成</span>
            <h2>听见妈妈的声音啦</h2>
            <p>“别怕，妈妈就在月光湖的另一边。”</p>
            <div class="score-line"><span>收集萤火虫</span><strong id="finalScore">0 / 12</strong></div>
            <button id="againButton" class="primary-button" type="button">再跳一次</button>
          </div>
        </div>
      </section>

      <aside class="prototype-note">
        <span>网页版试玩</span>
        <p>手机上按住画面蓄力，松开跳跃；电脑上使用鼠标。</p>
      </aside>
    </main>
    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
